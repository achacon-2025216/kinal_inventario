<div class="page-container">
  <div class="page-header">
    <div class="header-titles">
      <h2>Historial de Movimientos</h2>
      <p>Registro de entradas y salidas de mercancía en bodega.</p>
    </div>
    <a routerLink="/movimientos/nuevo" class="btn-primary">
      <svg class="icon-svg" viewBox="0 0 20 20"><path d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z"/></svg>
      Registrar Movimiento
    </a>
  </div>

  <div class="table-card" *ngIf="!cargando && movimientos.length > 0">
    <table class="custom-table">
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Tipo</th>
          <th>Producto</th>
          <th class="text-center">Cantidad</th>
          <th>Motivo</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let m of movimientos">
          <td style="color: var(--text-muted);">{{ m.fecha | date:'short' }}</td>
          <td>
            <span class="type-pill" [class.entry]="m.tipo === 'ENTRADA'" [class.exit]="m.tipo === 'SALIDA'">
              {{ m.tipo }}
            </span>
          </td>
          <td><strong style="color: #ffffff;">{{ m.producto?.nombre || 'Producto' }}</strong></td>
          <td class="text-center" style="font-weight: 700; color: #ffffff;">{{ m.cantidad }} un.</td>
          <td style="color: var(--text-muted);">{{ m.motivo || 'N/A' }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
